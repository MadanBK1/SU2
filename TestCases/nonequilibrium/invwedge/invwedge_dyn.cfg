%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Mach 5 inviscid flow over a 10deg wedge-AUSM               %
% Author: C. Garbacz                                                           %
% Institution: Strathclyde University                                          %
% Date: 2020.11.01                                                             %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= NEMO_EULER
GAS_MODEL= AIR-5
GAS_COMPOSITION= (0.77, 0.23, 0.0, 0.0, 0.0)
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ----------- COMPRESSIBLE AND INCOMPRESSIBLE FREE-STREAM DEFINITION ----------%
%
MACH_NUMBER= 5
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_TEMPERATURE_VE= 288.15

% ---- NONEQUILIBRIUM GAS, IDEAL GAS, POLYTROPIC, VAN DER WAALS AND PENG ROBINSON CONSTANTS -------%
%
FLUID_MODEL= SU2_NONEQ

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_EULER= ( Euler, Wall )
MARKER_OUTLET= ( Exit, 10 )
MARKER_FAR = ( Farfield, Inlet )
MARKER_PLOTTING= (NONE )
MARKER_MONITORING= ( Wall )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 3
LINEAR_SOLVER= BCGSTAB
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 5

% -----------------------------------------------------------------------%
%
CONV_NUM_METHOD_FLOW= AUSM
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -50
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-10

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= invwedge.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= restart_flow  
TABULAR_FORMAT= TECPLOT 
CONV_FILENAME= convergence
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= soln_volume
SURFACE_FILENAME= soln_surface     
OUTPUT_WRT_FREQ= 100
OUTPUT_FILES= (RESTART_ASCII, PARAVIEW_ASCII)

% 6b.a dynamic-grid gate (Kokkos port): unsteady dual time stepping on a rigidly moving grid
% (rotation changes the normals / coordinates every time step, translation gives a non-zero grid velocity).
% The CPU NEMO convective / BC numerics ignore the grid velocity; only the dt / max-eigenvalue
% grid-velocity terms and the GCL dual-time terms of CFVMFlowSolverBase see it (verbatim on the device).
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= 1e-6
MAX_TIME= 1.0
TIME_ITER= 4
INNER_ITER= 4
GRID_MOVEMENT= RIGID_MOTION
MOTION_ORIGIN= 0.0 0.0 0.0
ROTATION_RATE= 0.0 0.0 100.0
TRANSLATION_RATE= 20.0 0.0 0.0
